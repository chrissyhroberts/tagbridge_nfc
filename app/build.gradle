plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uk.ac.lshtm.tagbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.ac.lshtm.tagbridge'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    
    applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "TagBridge-${variant.versionName}-${variant.name}.apk"
    }

}
}